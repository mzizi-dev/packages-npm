# Registry drift gate.
#
# @bundu/ui's components (.astro), the framework-free modules they use, the
# brand assets they import, @bundu/server's helpers and the contract runner
# are BUILT FROM mzizi-dev/mzizi-registry, the single source of every
# component in every format, at the commit pinned in scripts/registry-ref.json
# (`pnpm registry:sync`). This job fails if any of those files differs from
# the registry at that commit, or if a package holds a component source the
# registry does not: a hand edit here is a fork, and the fix is upstream.
#
# It reads raw.githubusercontent.com at a pinned commit, so the answer is the
# same on every run. Moving the pin is a pull request.

name: Registry

on:
  pull_request:
  push:
    branches: [main, staging]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  drift:
    name: packages match the registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - run: node scripts/sync-registry.mjs --check
      - run: node scripts/fetch-contracts.mjs --check "$(node -p "require('./scripts/registry-ref.json').ref")"
